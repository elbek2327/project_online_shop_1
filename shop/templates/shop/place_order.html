<!-- place_order.html -->
{% extends 'shop/base/base.html' %}
{% load static %}
{% load price_filters %}


{% block place_order %}
<div class="container mt-4">


<div class="row gx-4 gx-lg-5 align-items-center">
    <div class="col-md-6">
        <h2>Order {{ product.name }}</h2>
        <div class="image-frame">
            <img class="card-img-top mb-5 mb-md-0" src="{{ product.get_absolute_url }}" alt="{{ product.name }}"/>
        </div>
        <p>Price: <b><i>{{ product.price|format_price }}</i></b> so'm</p>
        <p>Quantity: <b> {{ product.quantity }}</b></p>
    </div>
</div>

    <form action="{% url 'shop:product_placing' product.id %}" method="POST">
        {% csrf_token %}
        <div class="form-group">
            {{ form.as_p }}  <!-- Automatically renders all form fields -->
        </div>

        <button type="submit" class="btn btn-primary">Confirm Order</button>
        <a href="{% url 'shop:product_detail' product.id %}" class="btn btn-danger">Cancel</a>
        <a href="{% url 'shop:index' %}" class="btn btn-primary" style="background-color: green;">Back to main menu</a>
    </form>
</div>
{% endblock %}
